<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Pré-Cadastros v3.0</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e4e7ec;--brand:#315efb;--green:#087443;--red:#b42318;--shadow:0 8px 28px #10182812}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}
header{background:linear-gradient(125deg,#152554,#315efb);color:#fff;padding:28px max(20px,calc((100% - 1200px)/2)) 34px}
header h1{margin:0 0 6px;font-size:28px}header p{margin:0;color:#dfe7ff}
.wrap{max-width:1200px;margin:-18px auto 40px;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title h2{font-size:18px;margin:0}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 2px 8px #10182810}
button.primary{background:var(--brand);color:#fff}button:hover{filter:brightness(.97)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#344054}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);white-space:nowrap}.table-wrap{overflow:auto}
.notice{padding:11px 13px;border-radius:9px;background:#eff4ff;color:#1939a5;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <h1>Gestor de Pré-Cadastros</h1>
  <p>Interface conectada às tabelas relacionais do Google Sheets.</p>
</header>
<main class="wrap">
  <div class="panel">
    <div class="section-title">
      <h2>Novo Pré-Cadastro</h2>
      <button class="primary" onclick="salvarPreCadastro()">Gravar na Planilha</button>
    </div>
    <div class="notice">Os dados serão enviados separadamente para as abas <b>Pre_Cadastros</b> e <b>Pre_Cadastro_Valores</b>.</div>
    <div class="form">
      <div class="field">
        <label>ID do Modelo *</label>
        <input id="modeloId" value="MOD-01" required>
      </div>
      <div class="field">
        <label>Status *</label>
        <select id="statusPre">
          <option value="pendente">Pendente</option>
          <option value="em_conferencia">Em Conferência</option>
          <option value="aprovado">Aprovado</option>
        </select>
      </div>
      <div class="field wide">
        <label>Origem do Arquivo</label>
        <input id="origemArquivo" placeholder="Ex: Upload manual / API">
      </div>
      <div class="field full">
        <label>Observações</label>
        <textarea id="obsPre" placeholder="Detalhes adicionais..."></textarea>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">
      <h2>Valores Dinâmicos do Campo</h2>
      <button onclick="adicionarCampoDinamico()">+ Adicionar Campo</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID do Campo</th>
            <th>Nome do Campo</th>
            <th>Valor</th>
            <th>Origem do Valor</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="valoresBody">
          <tr>
            <td><input class="f-cid" value="CMP-01"></td>
            <td><input class="f-cnome" value="Nome Completo"></td>
            <td><input class="f-cval" value="Exemplo da Silva"></td>
            <td><input class="f-cori" value="Manual"></td>
            <td><button style="color:var(--red)" onclick="this.closest('tr').remove()">Remover</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
'use strict';
const WEB_APP_URL = 'SUA_URL_DO_WEB_APP_AQUI'; // Insira a URL gerada na implantação do Apps Script

function adicionarCampoDinamico() {
  const tbody = document.getElementById('valoresBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="f-cid" placeholder="CMP-XX"></td>
    <td><input class="f-cnome" placeholder="Nome do campo"></td>
    <td><input class="f-cval" placeholder="Valor preenchido"></td>
    <td><input class="f-cori" placeholder="Origem"></td>
    <td><button style="color:var(--red)" onclick="this.closest('tr').remove()">Remover</button></td>
  `;
  tbody.appendChild(tr);
}

function salvarPreCadastro() {
  const preId = 'PRE-' + Math.random().toString(36.substring(2, 9)).toUpperCase();
  const modeloId = document.getElementById('modeloId').value;
  const status = document.getElementById('statusPre').value;
  const origemArquivo = document.getElementById('origemArquivo').value;
  const observacoes = document.getElementById('obsPre').value;

  const valores = [];
  document.querySelectorAll('#valoresBody tr').forEach(tr => {
    valores.push({
      campo_id: tr.querySelector('.f-cid').value,
      nome_campo: tr.querySelector('.f-cnome').value,
      valor: tr.querySelector('.f-cval').value,
      origem_valor: tr.querySelector('.f-cori').value
    });
  });

  const payload = {
    pre_id: preId,
    modelo_id: modeloId,
    status: status,
    origem_arquivo: origemArquivo,
    observacoes: observacoes,
    criado_por: 'Usuario Web',
    valores: valores
  };

  if(WEB_APP_URL === 'SUA_URL_DO_WEB_APP_AQUI') {
    alert('Configure a URL do Web App do Google Apps Script no código antes de enviar.');
    console.log('Payload gerado:', payload);
    return;
  }

  fetch(WEB_APP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    alert('Dados enviados com sucesso para a planilha!');
  }).catch(err => {
    alert('Erro ao enviar: ' + err);
  });
}
</script>
</body>
</html>
